name: build-windows-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[all]"
      # Build PyInstaller's bootloader from source (the windows runner has MSVC). The prebuilt bootloader is shared
      # by thousands of programs, and antivirus machine-learning engines flag its fingerprint.
      - run: pip install --no-binary pyinstaller pyinstaller
      # Console window kept and no embedded browser (pywebview/.NET): a hidden window plus .NET interop made antivirus
      # engines more suspicious. One folder instead of --onefile: the single-file build unpacks itself into %TEMP% at every start, which
      # is what antivirus heuristics dislike most.
      - run: >
          pyinstaller --name vm2morpheus
          --collect-all pyVmomi --collect-all smbprotocol --collect-all winrm
          --hidden-import smbclient exe_entry.py
      - name: Bundle qemu-img next to the exe and record SHA-256 hashes
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          $q = "C:\Program Files\qemu"
          $app = "dist\vm2morpheus"
          New-Item -ItemType Directory "$app\qemu" | Out-Null
          Copy-Item "$q\qemu-img.exe" "$app\qemu\"
          Copy-Item "$q\*.dll" "$app\qemu\"
          Copy-Item README.md, config.example.yaml $app
          $hashes = Get-ChildItem "$app\vm2morpheus.exe", "$app\qemu\qemu-img.exe" |
            Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" }
          $hashes | Set-Content "$app\SHA256.txt" -Encoding ascii
          $hashes | ForEach-Object { Write-Host $_ }   # also visible in this job's log
          Compress-Archive -Path "$app\*" -DestinationPath vm2morpheus-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: vm2morpheus-windows, path: vm2morpheus-windows.zip }
