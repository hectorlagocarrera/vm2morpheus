[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vm2morpheus"
version = "0.8.1"
description = "Migrate VMs from Hyper-V / VMware to HPE Morpheus (VM Essentials, KVM) in one command"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6"]

[project.optional-dependencies]
hyperv = ["pywinrm>=0.4.3", "smbprotocol>=1.10"]
vmware = ["pyvmomi>=8.0"]
all = ["pywinrm>=0.4.3", "smbprotocol>=1.10", "pyvmomi>=8.0"]
dev = ["pytest"]

[project.scripts]
vm2morpheus = "vm2morpheus.cli:main"

[tool.setuptools.packages.find]
include = ["vm2morpheus*"]
